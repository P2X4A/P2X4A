<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Sergio Parra</title>
  <desc id="descripcion">Estudiante de Ingeniería de Sistemas en la Universidad El Bosque, Bogotá. Trabaja con Java, Angular y SQL.</desc>
  <defs>
    <pattern id="puntos" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#2A2E36"/>
    </pattern>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="26" fill="#16181D"/>
  <rect width="1200" height="320" rx="26" fill="url(#puntos)"/>

  <text x="76" y="106" font-family="Consolas, 'Courier New', monospace" font-size="17" letter-spacing="5" fill="#E58A63">HOLA, SOY</text>
  <text x="70" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#F3ECDF">Sergio Parra</text>
  <path d="M76 206 C 220 190, 400 224, 572 198" stroke="#E58A63" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text x="76" y="252" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#B3A898">Ingeniería de Sistemas · Universidad El Bosque · Bogotá</text>

  <g transform="translate(738 96) rotate(-9)" filter="url(#sombra)">
    <clipPath id="recorte1"><rect width="206" height="118" rx="14"/></clipPath>
    <rect width="206" height="118" rx="14" fill="#1F2229" stroke="#343842" stroke-width="1.5"/>
    <g clip-path="url(#recorte1)"><rect width="206" height="36" fill="#E2B04A"/></g>
    <circle cx="20" cy="18" r="4" fill="#FFFFFF" fill-opacity="0.55"/>
    <circle cx="34" cy="18" r="4" fill="#FFFFFF" fill-opacity="0.35"/>
    <text x="190" y="24" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">SQL</text>
    <text x="18" y="62" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#C9BFB1">SELECT nombre</text><text x="18" y="85" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#C9BFB1">FROM mascota;</text>
  </g>

  <g transform="translate(966 40) rotate(6)" filter="url(#sombra)">
    <clipPath id="recorte2"><rect width="188" height="118" rx="14"/></clipPath>
    <rect width="188" height="118" rx="14" fill="#1F2229" stroke="#343842" stroke-width="1.5"/>
    <g clip-path="url(#recorte2)"><rect width="188" height="36" fill="#7FB0DE"/></g>
    <circle cx="20" cy="18" r="4" fill="#FFFFFF" fill-opacity="0.55"/>
    <circle cx="34" cy="18" r="4" fill="#FFFFFF" fill-opacity="0.35"/>
    <text x="172" y="24" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Angular</text>
    <text x="18" y="62" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#C9BFB1">&lt;app-carrito&gt;</text><text x="18" y="85" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#C9BFB1">&lt;/app-carrito&gt;</text>
  </g>

  <g transform="translate(846 170) rotate(-2)" filter="url(#sombra)">
    <clipPath id="recorte3"><rect width="214" height="118" rx="14"/></clipPath>
    <rect width="214" height="118" rx="14" fill="#1F2229" stroke="#343842" stroke-width="1.5"/>
    <g clip-path="url(#recorte3)"><rect width="214" height="36" fill="#E58A63"/></g>
    <circle cx="20" cy="18" r="4" fill="#FFFFFF" fill-opacity="0.55"/>
    <circle cx="34" cy="18" r="4" fill="#FFFFFF" fill-opacity="0.35"/>
    <text x="198" y="24" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Java</text>
    <text x="18" y="62" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#C9BFB1">torneo.iniciar();</text><text x="18" y="85" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#C9BFB1">torneo.jugarTodos();</text>
  </g>
